<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot FURIA</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: black;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            padding: 20px;
            max-width: 400px;
            width: 90%; 
            background-color: black;
            border: 2px solid white;
            border-radius: 15px;
            transform: scale(1.5);
        }
        img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 2px solid white;
        }
        h1 {
            color: white;
            font-size: 24px;
            margin: 15px 0;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: white;
            color: black;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        button:hover {
            background-color: #ddd;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="furia.png" alt="FURIA Logo">
        <h1>FURIACSInfo</h1>
        <button onclick="window.location.href='https://t.me/furiachat64bot'">
            Acessar o Chatbot
        </button>
    </div>
</body>
</html>
